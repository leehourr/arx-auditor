[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arx-auditor"
version = "0.1.0"
description = "Scanner output → classified, drafted audit findings"
requires-python = ">=3.11"
dependencies = [
    "langgraph~=1.2",
    "langchain-anthropic>=1.7",
    "langgraph-checkpoint-sqlite>=3.1",
    "pydantic>=2.0",
    "chromadb>=1.5",
    "cohere>=7.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "langgraph-cli>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
